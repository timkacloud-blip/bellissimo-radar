name: mentions
on:
  schedule:
    - cron: '23 */2 * * *'      # every 2 hours: news feeds keep only the latest entries
  workflow_dispatch:
  push:
    paths: ['data/mentions_mac.json']
concurrency: { group: mentions, cancel-in-progress: false }
permissions: { contents: write, actions: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: state, path: state }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q google-play-scraper pytrends
      - name: Import what the Mac collected
        run: |
          python3 -c "import sqlite3;print(sqlite3.connect('state/mentions_data.db').execute('select count(*) from items').fetchone()[0])" > rows_before.txt
          python3 mentions/import_mac.py state/mentions_data.db data/mentions_mac.json
      - name: Collect
        env:
          MENTIONS_DB: state/mentions_data.db
          META_TOKEN: ${{ secrets.META_TOKEN }}
          YOUTUBE_KEY: ${{ secrets.YOUTUBE_KEY }}
        run: |
          SRC="rematch tgweb media"
          # once per Tashkent day (first run after midnight): app reviews and Google Trends. GitHub may delay or skip scheduled runs, so we look at the DB, not the clock.
          TODAY=$(TZ=Asia/Tashkent date +%F)
          LAST=$(python3 -c "import sqlite3;r=sqlite3.connect('state/mentions_data.db').execute(\"select last_run from status where source='play'\").fetchone();print((r[0] if r else '')[:10])")
          if [ "$LAST" != "$TODAY" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then SRC="$SRC play appstore trends yt"; fi
          # Instagram and ad comments (moved from the Mac): when the last run is 10+ hours old, i.e. about twice a day
          IGH=$(python3 -c "import sqlite3,datetime as d;r=sqlite3.connect('state/mentions_data.db').execute(\"select last_run from status where source='ig'\").fetchone();n=d.datetime.utcnow()+d.timedelta(hours=5);print(999 if not r else int((n-d.datetime.fromisoformat(r[0])).total_seconds()//3600))")
          if [ "$IGH" -ge 10 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then SRC="$SRC ig ads igc"; fi
          echo "sources: $SRC" 
          python3 mentions/collect.py $SRC 2>&1 | tee mentions.log
      - name: Re-check sentiment with the current dictionary
        env: { MENTIONS_DB: state/mentions_data.db }
        run: python3 mentions/collect.py reanalyze
      - name: Build data for the tab
        run: python3 mentions/build.py state/mentions_data.db site/mentions_data.json
      - name: Telegram alerts (new notable publications, negative spike)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 mentions/alerts.py state/mentions_data.db || echo "alerts failed"
      - name: Check the DB before saving (a broken DB must not overwrite the good one)
        run: |
          python3 - <<'PY'
          import sqlite3, sys
          db = sqlite3.connect('state/mentions_data.db'); ok = db.execute('PRAGMA integrity_check').fetchone()[0]
          n = db.execute('select count(*) from items').fetchone()[0]; before = int(open('rows_before.txt').read().strip() or 0)
          print('integrity', ok, 'rows', before, '->', n)
          if ok != 'ok' or n < before * 0.8: sys.exit('DB looks broken or lost more than 20% of rows: not saving')
          PY
      - name: Keep a copy of the DB (14 days)
        uses: actions/upload-artifact@v4
        with: { name: mentions-db, path: state/mentions_data.db, retention-days: 14, overwrite: true }
      - name: Save DB (state branch, history is overwritten)
        run: |
          cd state && git config user.name Claude && git config user.email noreply@anthropic.com
          git checkout -q --orphan s2 && git add -A && git commit -qm "state $(date -u +%F\ %H:%M)" && git push -q -f origin HEAD:state
      - name: Publish data
        run: |
          git config user.name Claude && git config user.email noreply@anthropic.com
          git add site/mentions_data.json site/mentions_feed.json && (git commit -qm "mentions $(date -u +%F\ %H:%M)" || echo nothing)
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && break || sleep 5; done
      - name: Republish the site with the new mentions
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh workflow run site.yml --ref main -R ${{ github.repository }}

name: daily
on:
  schedule:
    # GitHub starts scheduled runs late (up to ~5 h in practice), so start early and keep a backup run.
    - cron: '17 0 * * *'   # 05:17 Tashkent
    - cron: '47 2 * * *'   # 07:47 Tashkent, backup if the first one is delayed or fails
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pillow
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install Playwright
        run: npm install --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: Collect apps and Telegram
        run: python3 collector/collect.py all 2>&1 | tee data/logs/collect.txt
      - name: Collect Ad Library
        run: node collector/adlib_headless.js data/raw data/thumbs_store.json 2>&1 | tee data/logs/adlib.txt
      - name: Build site
        run: set -o pipefail; bash build.sh 2>&1 | tee data/logs/build.txt
      - name: Self-check
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 collector/checks.py data _site 2>&1 | tee data/logs/checks.txt
      - name: Save history
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data
          git commit -m "data $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase -X theirs || true
          git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - uses: actions/deploy-pages@v4
